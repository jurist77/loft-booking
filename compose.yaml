services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run npm run db:env}
      POSTGRES_USER: ${POSTGRES_USER:?Run npm run db:env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run db:env}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?Run npm run db:env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Run npm run db:env}
      POSTGRES_MIGRATION_USER: ${POSTGRES_MIGRATION_USER:?Run npm run db:env}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?Run npm run db:env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-studio-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", 'PGPASSWORD="$$POSTGRES_APP_PASSWORD" psql -h 127.0.0.1 -U "$$POSTGRES_APP_USER" -d "$$POSTGRES_DB" --no-password -tAc "SELECT 1" >/dev/null 2>&1']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  postgres_data:
