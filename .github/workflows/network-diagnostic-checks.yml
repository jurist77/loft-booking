name: Check Studio network diagnostic

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify failed-prepare reference from pinned source and official checksummed Caddy archives
        run: python3 -B scripts/diagnostics/build_https_residue_reference.py --verify
      - name: Fixture-only read-only and redaction checks; never run real VPS diagnostics
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/diagnostics -v
      - name: One-time quarantine isolated fixtures; no SSH or VPS actions
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/https_quarantine -v
      - name: Native one-time account and atomic-rename acceptance on disposable CI only
        run: sudo env STUDIO_QUARANTINE_CI=1 GITHUB_ACTIONS=true RUNNER_TEMP="$RUNNER_TEMP" PYTHONDONTWRITEBYTECODE=1 python3 tests/https_quarantine/real_identity.py
