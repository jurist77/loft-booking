name: Check Studio HTTPS

on:
  workflow_dispatch:
    inputs:
      hostname:
        description: "Registered public FQDN; public DNS only, NO SSH/apply"
        type: string
        required: true
      server_ip:
        description: "Expected public IPv4 or IPv6; never connected to"
        type: string
        required: true
      additional_ip:
        description: "Optional expected address of the other family"
        type: string
        required: false
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fixtures:
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Isolated settings, preflight, DNS, transport, rollback and privacy fixtures
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/https -v

  public_dns_check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Public DNS only; no secrets, SSH, VPS or apply
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/https/dns_check.py
