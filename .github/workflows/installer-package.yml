name: Build and verify SERVER installer package

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      publish_packages:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    name: Ubuntu 24.04 / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.12.0"
          cache: npm
      - name: Encryption tooling on disposable runner only
        run: |
          if ! command -v gpg >/dev/null; then
            sudo apt-get -o Acquire::Retries=3 -o APT::Update::Error-Mode=any update -qq
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gnupg
          fi
          command -v gpg >/dev/null
      - name: Installer security and transport unit tests
        run: python3 -m unittest discover -s tests/installer -p 'test_*.py' -v
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:integration
      - run: npm run build:server
      - run: npm run test:server:http
      - run: npm run test:api:http
      - name: Build native, private SERVER root filesystem
        env:
          STUDIO_SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 scripts/installer/package.py --version "$STUDIO_SOURCE_SHA" --output "$RUNNER_TEMP/server.tar.gz"
      # Keep selected app/lockfile intact, but obtain this CI helper from the
      # reviewed workflow revision even when restoring a pre-helper release.
      - name: Checkout current reviewed lifecycle controls independently of selected app version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .studio-verified-control
          persist-credentials: false
      - name: Install browser on the disposable release runner
        run: bash .studio-verified-control/scripts/ci/install-browser.sh
      - name: Require real browser journeys from the exact release package
        run: |
          python3 - <<'PY'
          import hashlib,os,pathlib
          archive=pathlib.Path(os.environ['RUNNER_TEMP'])/'server.tar.gz'
          with archive.open('rb') as stream: actual=hashlib.file_digest(stream,'sha256').hexdigest()
          if actual != pathlib.Path(str(archive)+'.sha256').read_text().strip(): raise SystemExit('PACKAGE_CHECKSUM_FAILED')
          PY
          browser_package="$(mktemp -d "$RUNNER_TEMP/studio-browser-package-XXXXXX")"
          trap 'rm -rf -- "$browser_package"' EXIT
          tar --extract --gzip --no-same-owner --file "$RUNNER_TEMP/server.tar.gz" --directory "$browser_package"
          export STUDIO_E2E_RELEASE_ROOT="$browser_package"
          export CHROMIUM_PATH="$(node --input-type=module -e 'import { chromium } from "@playwright/test"; process.stdout.write(chromium.executablePath());')"
          npm run test:server:browser
      - name: Use current controls for old-version restore acceptance; keep immutable app archive unchanged
        run: |
          python3 - <<'PY'
          import pathlib,shutil
          control=pathlib.Path('.studio-verified-control')
          for name in ('scripts/installer','scripts/https','tests/installer','tests/https','e2e-https'):
              shutil.copytree(control/name,pathlib.Path(name),dirs_exist_ok=True)
          shutil.copyfile(control/'playwright.https.config.ts','playwright.https.config.ts')
          PY
      # No real SSH connections in this PR: transport failures are mocked in
      # test_installer.py; the previous real_ssh.py is retained but not invoked.
      - name: Require pinned Caddy validation of exact production JSON and private-umask preparation
        run: |
          python3 - <<'PYVALIDATE'
          import pathlib,os,sys,platform
          sys.path.insert(0,'scripts/https')
          from artifacts import download
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'studio-production-caddy'
          root.mkdir()
          download({'x86_64':'x64','aarch64':'arm64'}[platform.machine()],root/'caddy.tar.gz')
          PYVALIDATE
          sudo env STUDIO_CADDY_VALIDATE_CI=1 GITHUB_ACTIONS=true python3 tests/https/production_validate.py --archive "$RUNNER_TEMP/studio-production-caddy/caddy.tar.gz"
          python3 -B tests/https/full_archive_transport.py --archive "$RUNNER_TEMP/studio-production-caddy/caddy.tar.gz"
      - name: Browser CA tooling on disposable CI runner only
        run: |
          if ! command -v certutil >/dev/null; then
            sudo apt-get -o Acquire::Retries=3 -o APT::Update::Error-Mode=any update -qq
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libnss3-tools
          fi
          command -v certutil >/dev/null
      - name: Require real Caddy TLS, browser SQLite flow, recovery timer and HTTPS-aware update/restore
        env:
          STUDIO_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          export CHROMIUM_PATH="$(node --input-type=module -e 'import { chromium } from "@playwright/test"; process.stdout.write(chromium.executablePath());')"
          sudo env STUDIO_INSTALLER_CI=1 GITHUB_ACTIONS=true PATH="$PATH" CHROMIUM_PATH="$CHROMIUM_PATH" python3 tests/https/real_systemd.py --archive "$RUNNER_TEMP/server.tar.gz" --version "$STUDIO_SOURCE_SHA"
          python3 - <<'PY'
          import sys,pathlib,platform,tarfile,tempfile,subprocess,os
          sys.path.insert(0,'scripts/https')
          from artifacts import download
          with tempfile.TemporaryDirectory(prefix='studio-local-tls-') as folder:
              root=pathlib.Path(folder)
              archive=download({'x86_64':'x64','aarch64':'arm64'}[platform.machine()],root/'caddy.tar.gz')
              with tarfile.open(archive) as source: (root/'caddy').write_bytes(source.extractfile('caddy').read())
              os.chmod(root/'caddy',0o755)
              subprocess.run([sys.executable,'tests/https/local_tls.py',str(root/'caddy')],check=True,timeout=210)
          PY
      - name: Real systemd installation, updates, failures and schema-aware rollback on CI only
        env:
          STUDIO_SOURCE_SHA: ${{ inputs.source_sha }}
        run: sudo env STUDIO_INSTALLER_CI=1 GITHUB_ACTIONS=true python3 tests/installer/real_systemd.py --archive "$RUNNER_TEMP/server.tar.gz" --version "$STUDIO_SOURCE_SHA"
      - name: Publish only the verified immutable package (never VPS data)
        if: inputs.publish_packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: studio-server-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/server.tar.gz
            ${{ runner.temp }}/server.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
