name: Build and verify SERVER installer package

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      publish_packages:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    name: Ubuntu 24.04 / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.12.0"
          cache: npm
      - name: Installer security and transport unit tests
        run: python3 -m unittest discover -s tests/installer -p 'test_*.py' -v
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:integration
      - run: npm run build:server
      - run: npm run test:server:http
      - run: npm run test:api:http
      - name: Build native, private SERVER root filesystem
        env:
          STUDIO_SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 scripts/installer/package.py --version "$STUDIO_SOURCE_SHA" --output "$RUNNER_TEMP/server.tar.gz"
      - name: Install SSH tools only on the disposable CI runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass openssh-server
      - name: Real local SSH authentication and transport tests on CI only
        run: sudo env STUDIO_INSTALLER_CI=1 GITHUB_ACTIONS=true python3 tests/installer/real_ssh.py
      - name: Real systemd installation, updates, failures and schema-aware rollback on CI only
        env:
          STUDIO_SOURCE_SHA: ${{ inputs.source_sha }}
        run: sudo env STUDIO_INSTALLER_CI=1 GITHUB_ACTIONS=true python3 tests/installer/real_systemd.py --archive "$RUNNER_TEMP/server.tar.gz" --version "$STUDIO_SOURCE_SHA"
      - name: Publish only the verified immutable package (never VPS data)
        if: inputs.publish_packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: studio-server-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/server.tar.gz
            ${{ runner.temp }}/server.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
