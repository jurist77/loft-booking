name: Enable Studio HTTP access

on:
  workflow_dispatch:
    inputs:
      server_ip:
        description: "Studio VPS IPv4 or IPv6"
        type: string
        required: true
      mode:
        description: "check reads only; apply adds one UFW TCP/3000 allow if proven safe"
        type: choice
        options: [check, apply]
        default: check
        required: true
      confirmation:
        description: "For apply type exactly ENABLE STUDIO TCP 3000"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: studio-http-access-${{ inputs.server_ip }}
  cancel-in-progress: false

jobs:
  access:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate inputs before SSH tooling or network requests
        env:
          STUDIO_SERVER_IP: ${{ inputs.server_ip }}
          STUDIO_HTTP_MODE: ${{ inputs.mode }}
          STUDIO_HTTP_CONFIRMATION: ${{ inputs.confirmation }}
          STUDIO_PASSWORD_PRESENT: ${{ secrets.STUDIO_SSH_PASSWORD != '' }}
        run: |
          python3 - <<'PY'
          import os,sys
          sys.path.insert(0,'scripts/installer')
          from deploy import server_ip,DeployError
          try:
              server_ip(os.environ.get('STUDIO_SERVER_IP',''))
              mode = os.environ.get('STUDIO_HTTP_MODE','')
              if mode not in ('check','apply'): raise ValueError()
              if mode == 'apply' and os.environ.get('STUDIO_HTTP_CONFIRMATION') != 'ENABLE STUDIO TCP 3000': raise ValueError()
              if os.environ.get('STUDIO_PASSWORD_PRESENT') != 'true': raise ValueError()
          except (DeployError,ValueError):
              print('FAILED_NO_CHANGE: invalid input, confirmation or missing existing Secret');sys.exit(1)
          PY
      - name: SSH client tooling on disposable runner only
        run: |
          if ! command -v sshpass >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends sshpass
          fi
      - name: Preflight, optional single UFW allow, then independent external health
        env:
          STUDIO_SERVER_IP: ${{ inputs.server_ip }}
          STUDIO_HTTP_MODE: ${{ inputs.mode }}
          STUDIO_HTTP_CONFIRMATION: ${{ inputs.confirmation }}
          STUDIO_SSH_PASSWORD: ${{ secrets.STUDIO_SSH_PASSWORD }}
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/firewall/studio_http_access.py
