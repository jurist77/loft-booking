name: Check universal installer

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: installer-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    uses: ./.github/workflows/installer-package.yml
    with:
      source_sha: ${{ github.sha }}
