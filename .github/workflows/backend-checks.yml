name: Check backend foundation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:server
      - run: npm run db:env
      - run: npm run db:test:up
      - run: npm run test:integration
      - run: npm run test:server:http
      - name: Verify persistent database failure causes a nonzero health test exit
        run: npm run test:server:http:failure
      - name: Stop test PostgreSQL without deleting its volume
        if: always()
        run: npm run db:test:stop
      - name: Prove static DEMO ignores database configuration
        run: npm run test:demo:isolation
