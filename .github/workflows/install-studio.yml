name: Install Studio 19.25

on:
  workflow_dispatch:
    inputs:
      server_ip:
        description: "VPS IPv4 or IPv6 (Ubuntu 24.04; SSH root:22)"
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: studio-install-${{ inputs.server_ip }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require literal IP, main and successful checks for this exact SHA
        env:
          STUDIO_SERVER_IP: ${{ inputs.server_ip }}
          STUDIO_PASSWORD_PRESENT: ${{ secrets.STUDIO_SSH_PASSWORD != '' }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/installer/verify-main.py
  packages:
    needs: validate
    uses: ./.github/workflows/installer-package.yml
    with:
      source_sha: ${{ github.sha }}
      publish_packages: true
  install:
    needs: [validate, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: studio-server-*
          path: ${{ runner.temp }}/studio-packages
      - name: SSH password transport tools (runner only)
        run: |
          if ! command -v sshpass >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends sshpass
          fi
      - name: Install or update only Studio; SSH host identity verification disabled by owner
        env:
          STUDIO_SERVER_IP: ${{ inputs.server_ip }}
          STUDIO_SSH_PASSWORD: ${{ secrets.STUDIO_SSH_PASSWORD }}
          STUDIO_SOURCE_SHA: ${{ github.sha }}
        run: python3 scripts/installer/deploy.py --artifacts "$RUNNER_TEMP/studio-packages" --version "$STUDIO_SOURCE_SHA"
  result:
    if: always()
    needs: [validate, packages, install]
    runs-on: ubuntu-24.04
    permissions:
      actions: write # Delete only this run's transient package artifacts after transfer.
    steps:
      - name: Remove this run's transient packages without keeping billable build storage
        id: artifact_cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name | startswith("studio-server-")) | .id' > "$RUNNER_TEMP/studio-artifact-ids"
          while IFS= read -r artifact_id; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done < "$RUNNER_TEMP/studio-artifact-ids"
      - name: Final workflow outcome
        if: always()
        env:
          STUDIO_INSTALL_RESULT: ${{ needs.install.result }}
          STUDIO_CLEANUP_RESULT: ${{ steps.artifact_cleanup.outcome }}
        run: |
          if [ "$STUDIO_INSTALL_RESULT" = success ] && [ "$STUDIO_CLEANUP_RESULT" = success ]; then
            echo 'SUCCESS: see installation summary for version, migrations, service, health and private listener.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$STUDIO_INSTALL_RESULT" = success ]; then
            echo 'FAILED: application installation and health were confirmed, but transient artifact cleanup failed. The working application was not rolled back for a GitHub storage error.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo 'FAILED: no successful deployment is claimed. See the safe error code in earlier jobs; after transport interruption the server outcome may be unknown.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
