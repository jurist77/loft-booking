name: Check read-only VPS audit tool

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit-tool:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test anonymization, read-only commands and unavailable tools
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/vps-audit -v
      - name: Validate JSON on a CI runner (not a VPS measurement)
        run: |
          python3 scripts/vps-audit.py --label local-validation > "$RUNNER_TEMP/audit.json"
          python3 -m json.tool "$RUNNER_TEMP/audit.json" > /dev/null
